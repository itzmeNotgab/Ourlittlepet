name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Bootstrap native Android project (and print debug SHA-1)
        run: node scripts/bootstrap-android.js
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}

      - name: TypeScript check (app)
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci

      - name: Build Cloud Functions (TypeScript check)
        run: |
          cd functions
          npm install --no-audit --no-fund
          npm run build

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: our-little-pet-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
